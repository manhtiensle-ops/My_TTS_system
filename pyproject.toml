[project]
name = "my-tts-system"
version = "0.1.0"
description = "Vietnamese TTS Server — VieNeu-TTS v3 Turbo (Video Shorts + Novel Reader)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.4",
    "vieneu",
    "pydub>=0.25",
]

[project.scripts]
tts-server = "app:main"
